name: Deploy Kyvault site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'desktop/ui/logo.png'
      - 'docs/assets/ky-logo.png'
      - 'docs/styles.css'
      - 'docs/assets/desktop/home-motion.png'
      - 'docs/assets/desktop/vault.png'
      - 'docs/assets/desktop/private.png'
      - 'docs/assets/desktop/social.png'
      - 'docs/assets/desktop/card.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep existing docs/proposals/ out of the published artifact.
      - name: Assemble the public site only
        run: |
          mkdir -p _site/assets/desktop
          cp -L docs/assets/ky-logo.png _site/assets/ky-logo.png
          cp docs/index.html docs/styles.css _site/
          cp docs/assets/desktop/{home,home-motion,vault,private,social,card}.png _site/assets/desktop/
          python3 - <<'PYTHON'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit

          class Images(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  if tag == "img":
                      url = urlsplit(dict(attrs)["src"])
                      if not url.netloc:
                          assert (Path("_site") / url.path).is_file(), url.path

          Images().feed(Path("_site/index.html").read_text())
          PYTHON
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
