name: Deploy Kyvault site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'docs/styles.css'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep existing docs/proposals/ out of the published artifact.
      - name: Assemble the public site only
        run: |
          mkdir -p _site
          cp docs/index.html docs/styles.css _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
