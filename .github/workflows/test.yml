name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # python3 + cryptography 是给 tests/interop.rs 用的：那组测试真的起一个
      # Python 进程做双向对照，验证 Rust 解得开 Python 写的密文。ubuntu runner
      # 自带 python3，只需补 cryptography。
      - name: 装 cryptography（互操作测试要用）
        run: python3 -m pip install --break-system-packages cryptography
      - name: fmt
        working-directory: rust
        run: cargo fmt --check
      - name: clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        working-directory: rust
        run: cargo test --all-features

  # Python 版**命令面已被 Rust 全覆盖**（2026-09-10 补齐 check/providers/doctor/
  # import/server/cli/update/connect/wizard 九个，两侧 `add_parser` 与 clap 子命令
  # 逐条对齐）。这个 job 仍留着，因为还有一件事卡着删除：
  #
  #   tests/interop.rs 的 server_and_cli_buckets_survive_both_directions 会
  #   `from kyvault.store import set_server`，靠 Python 实现做对照来验证
  #   _servers/_clis 嵌套结构的双向兼容。删掉 Python 这条测试就没了对照。
  #
  # 删除前该做的是把它改成固定测试向量（KAT）：用 Python 生成一份
  # master.key + secrets.json 存成测试资源，让 Rust 对着固定密文解。那样既不依赖
  # Python，也不依赖本机装没装 cryptography，CI 里能真跑而不是静默跳过。
  # 做完这一步，本 job 连同 kyvault/ tests/ pyproject.toml uv.lock 一起删。
  #
  # 注意上面那个 python3 + cryptography 步骤要留 —— interop.rs 的其余 5 条用的是
  # 内联脚本 + cryptography 标准库，与本仓 Python 包无关。
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - run: python -m pytest tests/ -v
