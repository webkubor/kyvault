name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # python3 + cryptography 是给 tests/interop.rs 用的：那组测试真的起一个
      # Python 进程做双向对照，验证 Rust 解得开 Python 写的密文。ubuntu runner
      # 自带 python3，只需补 cryptography。
      - name: 装 cryptography（互操作测试要用）
        run: python3 -m pip install --break-system-packages cryptography
      - name: fmt
        working-directory: rust
        run: cargo fmt --check
      - name: clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        working-directory: rust
        run: cargo test --all-features

  # Python 版仍在维护期（Rust 版补齐 import/check/connect 之前不下线），
  # 所以这条继续跑。等 Python 实现移除时连这个 job 一起删。
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - run: python -m pytest tests/ -v
