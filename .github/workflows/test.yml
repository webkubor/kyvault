name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      # python3 + cryptography 是给 tests/interop.rs 用的：那组测试真的起一个
      # Python 进程做双向对照，验证 Rust 解得开 Python 写的密文。ubuntu runner
      # 自带 python3，只需补 cryptography。
      - name: 装 cryptography（互操作测试要用）
        run: python3 -m pip install --break-system-packages cryptography
      - name: fmt
        working-directory: rust
        run: cargo fmt --check
      - name: clippy
        working-directory: rust
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        working-directory: rust
        run: cargo test --all-features

  # Python 版仍在维护期，所以这条继续跑；Python 实现移除时连这个 job 一起删。
  #
  # 下线前提 = Rust 侧补齐这 9 个子命令（2026-09-10 实测差集，约 700 行实现）：
  #   check（validator.py 341 行）· import（import_env.py 151 行）
  #   doctor（doctor.py 111 行）· wizard（88 行）· update（updater.py 74 行）
  #   providers · connect · server · cli
  # Rust 现有：init get set annotate delete list platforms account key platform alias run
  #
  # 注意 interop.rs 不在此列 —— 它的 Python 脚本是内联的、只依赖 cryptography 标准库，
  # 不 import 本仓的 Python 包（实测把 kyvault/ 改名后 5 个测试照样全过）。
  # 所以「Python 实现」和「interop 用的 python3」是两回事，删前者不影响后者。
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - run: python -m pytest tests/ -v
