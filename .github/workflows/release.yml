name: Create Release

# 打 v* tag 时交叉编译 Rust 二进制并附到 Release。
#
# 为什么改成二进制分发：Rust 版存在的意义就是「不依赖运行时」——
# Python 版那条 pip install 链条上任何一环坏掉（尤其是解释器的 TLS 验证路径），
# 密钥库就只读，而它是所有需要凭据的活的底座。发一个静态二进制，
# 装它的人不需要有 Python、也不需要有 Rust 工具链。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # upload-rust-binary-action 只负责「上传 asset」，Release 本身得先存在 ——
  # 第一版漏了这个 job，四个 target 全都编译打包成功、然后卡在 release not found
  # 重试 11 次后失败。
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1
        with:
          changelog: CHANGELOG.md
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-assets:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # 上传前先跑一遍测试：发布是最后一道门，不依赖「之前某次 CI 应该跑过了」。
      # 跨语言互操作测试在这里尤其要跑 —— 它守的是「解得开存量密钥」，
      # 那条断了比任何功能缺失都严重。
      - name: 测试
        if: matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-unknown-linux-gnu'
        working-directory: rust
        run: cargo test --all-features

      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: kyvault
          target: ${{ matrix.target }}
          manifest-path: rust/Cargo.toml
          archive: kyvault-$target
          token: ${{ secrets.GITHUB_TOKEN }}
