name: Desktop
on:
  push:
    branches: [main]
    paths: ['desktop/**', 'rust/**', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['desktop/**', 'rust/**', '.github/workflows/desktop.yml']
permissions:
  contents: read
env:
  KYVAULT_NO_TELEMETRY: "1"

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            desktop/src-tauri
      - run: npm ci && npm run check
        working-directory: desktop
      - run: cargo fmt --check && cargo clippy --all-targets -- -D warnings && cargo test
        working-directory: desktop/src-tauri
      - run: cargo test --all-features
        working-directory: rust
      - name: Bundle app (smoke build, no updater signing)
        run: >-
          npm run build -- --bundles app --config '{"bundle":{"createUpdaterArtifacts":false,"macOS":{"signingIdentity":"-"}}}'
        working-directory: desktop
      - name: Verify microphone access in signed Ky.app
        working-directory: desktop
        run: |
          app=src-tauri/target/release/bundle/macos/Ky.app
          codesign --verify --deep --strict "$app"
          codesign --display --xml --entitlements - "$app" > "$RUNNER_TEMP/ky-entitlements.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.audio-input' "$RUNNER_TEMP/ky-entitlements.plist")" = true
