name: 功能建议
description: 提出一个新功能或改进想法
title: "[feat] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        说清楚**谁**在什么场景下需要它，比说清楚怎么实现更重要。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 你现在是怎么做的？哪一步别扭？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你期望的样子
      description: 大致命令形态或用法示例即可
      render: shell
      placeholder: |
        ky something --flag value
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的其他做法
      description: 包括「为什么不用现成的工具」
    validations:
      required: false
