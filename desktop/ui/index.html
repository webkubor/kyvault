<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Ky</title>
  <script src="appearance.js"></script>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="workspace.css">
  <link rel="stylesheet" href="home.css">
  <link rel="stylesheet" href="account.css">
  <link rel="stylesheet" href="toast.css">
  <link rel="stylesheet" href="controls.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <!-- Compact widths use icon navigation and a detail sheet. -->
  <aside class="sidebar">
    <header class="brand">
      <div class="brand-mark"><img src="logo.png" alt="Ky" width="28" height="28"></div>
    </header>
    <fieldset id="appearance" data-i18n-aria="theme.title">
    <label><input type="radio" name="appearance" value="system" data-i18n-aria="theme.system"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h18v13H3z M8 21h8m-4-4v4"/></svg><span data-i18n="theme.system">系统</span></span></label>
    <label><input type="radio" name="appearance" value="light" data-i18n-aria="theme.light"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 1 0 0-10 M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span data-i18n="theme.light">浅色</span></span></label>
    <label><input type="radio" name="appearance" value="dark" data-i18n-aria="theme.dark"><span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15a9 9 0 0 1-11-11 9 9 0 1 0 11 11z"/></svg><span data-i18n="theme.dark">深色</span></span></label>
    </fieldset>
    <select id="appearance-select" data-i18n-aria="theme.title"><option value="system" data-i18n="theme.system">系统</option><option value="light" data-i18n="theme.light">浅色</option><option value="dark" data-i18n="theme.dark">深色</option></select>
    <nav>
      <button class="nav-item" data-view="home" data-i18n-aria="nav.home"><span class="nav-icon" aria-hidden="true"></span><span data-i18n="nav.home"></span></button>
      <div class="nav-group" data-i18n="group.recent"></div>
      <button class="nav-item" data-view="history" data-i18n-aria="nav.history"><span class="nav-icon" aria-hidden="true"></span><span data-i18n="nav.history"></span></button>
      <div class="nav-group" data-i18n="group.personal"></div>
      <button class="nav-item" data-view="vault" data-i18n-aria="nav.vault"><span class="nav-icon" aria-hidden="true"></span><span data-i18n="nav.vault"></span></button>
      <button class="nav-item" data-view="private" data-i18n-aria="nav.private"><span class="nav-icon" aria-hidden="true"></span><span data-i18n="nav.private"></span></button>
      <button class="nav-item" data-view="drafts" data-i18n-aria="nav.drafts"><span class="nav-icon" aria-hidden="true"></span><span data-i18n="nav.drafts"></span></button>
      <div class="nav-group" data-i18n="group.exchange"></div>
      <button class="nav-item" data-view="shares" data-i18n-aria="nav.shares"><span class="nav-icon" aria-hidden="true"></span><span data-i18n="nav.shares"></span></button>
      <button class="nav-item" data-view="feedback" data-i18n-aria="nav.feedback"><span class="nav-icon" aria-hidden="true"></span><span data-i18n="nav.feedback"></span></button>
    </nav>
    <div class="sidebar-bottom">
      <button class="nav-item" data-view="account" data-i18n-aria="nav.account"><span class="nav-icon" aria-hidden="true"></span><span data-i18n="nav.account"></span></button>
      <button class="nav-item" data-view="settings" data-i18n-aria="nav.settings"><span class="nav-icon" aria-hidden="true"></span><span data-i18n="nav.settings"></span></button>
      <button id="about" class="sidebar-action" aria-haspopup="dialog" aria-controls="about-dialog" data-i18n-aria="about.title">
        <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 3h10l3 3v15H6z M15 3v5h4 M9 12h7 M9 16h5"/></svg>
        <span class="action-caption" data-i18n="about.title"></span><span id="update-dot" class="update-dot" role="img" data-i18n-aria="about.hasUpdate" hidden></span>
      </button>
      <button id="lock" class="sidebar-action" data-i18n-aria="action.lock">
        <svg class="action-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m3 3 18 18 M9.5 5.4A11 11 0 0 1 12 5c5 0 9 5 10 7a18 18 0 0 1-3 4 M6.2 6.2A22 22 0 0 0 2 12c1 2 5 7 10 7a12 12 0 0 0 5-1.3 M10 10a3 3 0 0 0 4 4"/></svg>
        <span class="action-caption" data-i18n="action.lock"></span>
      </button>
    </div>
  </aside>

  <main>
    <header class="toolbar" id="toolbar">
      <div class="toolbar-title" id="toolbar-title">
        <h1 id="view-title"></h1>
      </div>
      <div class="toolbar-right">
        <button id="add" class="primary"></button>
        <button id="collapse-toolbar" class="icon" data-i18n-aria="toolbar.collapse" aria-expanded="true"><span class="chevron" aria-hidden="true"></span></button>
      </div>
    </header>

    <button type="button" id="update-notice" class="quiet" aria-haspopup="dialog" aria-controls="about-dialog" hidden></button>
    <div class="search-row" id="search-row">
      <span class="search-icon" aria-hidden="true"></span>
      <input id="search" type="search" autocomplete="off" spellcheck="false" data-i18n-placeholder="search.placeholder" data-i18n-aria="search.aria">
      <kbd aria-hidden="true">⌘ F</kbd>
    </div>

    <div id="vault-platform-row" hidden><label for="vault-platform" data-i18n="vault.platform"></label><select class="ky-control" id="vault-platform"></select></div>
    <div id="error" class="error" role="alert" hidden></div>

    <div id="collection-panes">
    <section id="library" class="library">
      <ul id="entries" role="list"></ul>
      <div id="empty" class="empty"><h2 id="empty-title"></h2><p id="empty-copy"></p></div>
    </section>

    <!-- Detail slides over the list; only one is visible at a time. -->
    <section id="detail" class="detail" hidden aria-label="Detail"></section>

    </div>
    <section id="home" hidden></section>
    <section id="account" hidden></section>
    <section id="workspace" hidden></section>
    <section id="settings" class="settings" hidden>
      <div class="setting-row">
        <div><label for="flash-sound" data-i18n="flash.sound"></label></div><input id="flash-sound" type="checkbox" class="ky-control" role="switch">
      </div>
      <div class="setting-row">
        <div><h3 data-i18n="flash.sources"></h3><p data-i18n="flash.desc"></p><div id="flash-sources"></div><button id="flash-browser" class="quiet" data-i18n="flash.browser"></button><p id="flash-install" hidden data-i18n="flash.install"></p></div>
        <button id="flash-app" data-i18n="flash.choose"></button>
      </div>
      <div class="setting-row">
        <div><label for="monitoring" data-i18n="settings.monitoring.label"></label><p data-i18n="settings.monitoring.desc"></p></div>
        <input class="ky-control" id="monitoring" type="checkbox" role="switch">
      </div>
      <div class="setting-row">
        <div><label for="language" data-i18n="settings.language.label"></label><p data-i18n="settings.language.desc"></p></div>
        <select class="ky-control" id="language" data-i18n-aria="settings.language.aria"><option value="zh-CN">中文</option><option value="en">English</option></select>
      </div>
      <div class="setting-row">
        <div><h3 data-i18n="settings.redaction.title"></h3><p data-i18n="settings.redaction.desc"></p></div>
        <span class="badge" data-i18n="settings.badge.always"></span>
      </div>
      <div class="setting-row">
        <div><h3 data-i18n="settings.footprint.title"></h3><p data-i18n="settings.footprint.desc"></p></div>
      </div>
      <div class="setting-row">
        <div><h3 data-i18n="settings.privacy.title"></h3><p data-i18n="settings.privacy.desc"></p></div>
      </div>
      <div class="setting-row">
        <div><h3 data-i18n="settings.tray.title"></h3><p data-i18n="settings.tray.desc"></p></div>
      </div>
      <div class="setting-row">
        <div><h3 data-i18n="settings.clear.title"></h3><p data-i18n="settings.clear.desc"></p></div>
        <button id="clear" class="danger" data-i18n="action.clear"></button>
      </div>
    </section>

    <footer>
      <span id="status" role="status"></span>
      <button id="capture" class="quiet" data-i18n="action.capture"></button>
    </footer>
  </main>

  <dialog id="credential" aria-labelledby="credential-title">
    <form id="secret-form" autocomplete="off">
      <div class="dialog-heading"><h2 id="credential-title" data-i18n="cred.title"></h2><button type="button" class="quiet close" data-i18n-aria="dialog.close" aria-label="">×</button></div>
      <p id="cred-request-note" class="hint" hidden></p>
      <label for="secret-platform" data-i18n="cred.platform.label"></label>
      <input class="ky-control" id="secret-platform" list="credential-platforms" required autocomplete="off" spellcheck="false" placeholder="Apple / GitLab">
      <datalist id="credential-platforms"></datalist>
      <label for="credential-type" data-i18n="cred.type"></label>
      <select class="ky-control" id="credential-type"><option value="Password" data-i18n="cred.password"></option><option value="API Key" data-i18n="cred.key"></option></select>
      <label for="secret-value" data-i18n="cred.value.label"></label>
      <input class="ky-control" id="secret-value" type="password" required autocomplete="new-password" spellcheck="false">
      <p class="hint" id="cred-verify-hint" data-i18n="cred.value.hint"></p>
      <details class="cred-advanced">
        <summary data-i18n="cred.advanced.label"></summary>
        <p class="hint" data-i18n="cred.advanced.hint"></p>
        <label for="secret-name" data-i18n="cred.name.label"></label>
        <input class="ky-control" id="secret-name" placeholder="main" autocomplete="off" spellcheck="false">
        <label for="secret-account" data-i18n="cred.account.label"></label>
        <input class="ky-control" id="secret-account" placeholder="octocat@example.com" autocomplete="off" spellcheck="false">
        <label for="secret-alias" data-i18n="cred.alias.label"></label>
        <input class="ky-control" id="secret-alias" placeholder="github_token" autocomplete="off" spellcheck="false">
      </details>
      <p id="secret-error" class="error" role="alert" hidden></p>
      <div class="dialog-actions"><button type="button" class="quiet close" data-i18n="action.cancel"></button><button class="primary" type="submit" data-i18n="action.saveCredential"></button></div>
    </form>
  </dialog>

  <dialog id="agent-request" aria-labelledby="agent-request-title">
    <form id="agent-request-form" autocomplete="off">
      <div class="dialog-heading"><h2 id="agent-request-title" data-i18n="req.title"></h2><button type="button" class="quiet close" data-i18n-aria="dialog.close" aria-label="">×</button></div>
      <p id="agent-request-meta" class="hint"></p>
      <label for="agent-request-value" data-i18n="cred.value.label"></label>
      <input class="ky-control" id="agent-request-value" type="password" required autocomplete="new-password" spellcheck="false">
      <p class="hint" id="agent-request-hint" data-i18n="req.paste.hint"></p>
      <p id="agent-request-error" class="error" role="alert" hidden></p>
      <div class="dialog-actions"><button type="button" id="agent-request-discard" class="quiet" data-i18n="req.discard"></button><button class="primary" type="submit" data-i18n="req.save"></button></div>
    </form>
  </dialog>

  <dialog id="confirm" aria-labelledby="confirm-title"><h2 id="confirm-title"></h2><p id="confirm-copy"></p><div class="dialog-actions"><button id="confirm-cancel" autofocus data-i18n="action.cancel"></button><button id="confirm-action" class="primary"></button></div></dialog>

  <dialog id="locked" aria-labelledby="locked-title"><h2 id="locked-title" data-i18n="locked.title"></h2><p data-i18n="locked.copy"></p><p id="unlock-error" class="error" role="alert" hidden></p><button id="unlock" class="primary" data-i18n="action.unlock"></button></dialog>

  <dialog id="about-dialog" class="about-dialog" aria-labelledby="about-title">
    <div class="dialog-heading"><h2 id="about-title" data-i18n="about.title"></h2><button type="button" class="quiet close" data-i18n-aria="dialog.close" aria-label="">×</button></div>
    <div id="update-detail" class="update-detail" hidden>
      <strong id="update-available-text" tabindex="-1"></strong>
      <p id="update-notes" class="release-description"></p>
      <button id="do-update" class="primary" data-i18n="about.restart"></button>
    </div>
    <progress id="update-progress" hidden max="100" data-i18n-aria="about.downloading"></progress>
    <div class="about-current">
      <span data-i18n="about.current"></span>
      <strong id="about-version">v0.3.6</strong>
    </div>
    <ul class="current-notes">
      <li data-i18n="about.previewNotes"></li>
      <li data-i18n="about.inAppInstall"></li>
    </ul>
    <div class="about-actions">
      <button id="check-update" class="primary" data-i18n="about.check"></button>
      <span id="update-status" class="hint" role="status"></span>
    </div>
    <h3 data-i18n="about.history"></h3>
    <div id="release-notes" class="release-notes"><p class="hint" data-i18n="about.loading"></p></div>
  </dialog>
  <div id="toasts"></div>
  <div id="toast-live" role="status" aria-atomic="true"></div>
</body>
</html>
